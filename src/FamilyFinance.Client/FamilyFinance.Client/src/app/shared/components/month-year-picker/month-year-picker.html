<div class="picker-container" [class.variant-input]="variant() === 'input'">
  <!-- Trigger Button -->
  <button
    type="button"
    class="picker-trigger"
    (click)="togglePopover()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-expanded]="isOpen()"
  >
    <span class="calendar-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="3.5" y="5" width="17" height="15.5" rx="2" stroke="currentColor" stroke-width="1.8"></rect>
        <path d="M7.5 3v4M16.5 3v4M4 9.5h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
      </svg>
    </span>

    <span class="picker-label">{{ selectedMonthLabel() }}</span>

    <span class="chevron-icon" [class.rotated]="isOpen()" aria-hidden="true">
      <svg viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
      </svg>
    </span>
  </button>

  <!-- Popover Dropdown Grid -->
  @if (isOpen()) {
    <div class="picker-popover" role="dialog" aria-modal="false" [attr.aria-label]="ariaLabel()">
      <!-- Year Navigation Header -->
      <div class="popover-header">
        <button
          type="button"
          class="nav-btn"
          (click)="prevYear(); $event.stopPropagation()"
          aria-label="Previous year"
        >
          ‹
        </button>

        <span class="nav-year">{{ navigatingYear() }}</span>

        <button
          type="button"
          class="nav-btn"
          (click)="nextYear(); $event.stopPropagation()"
          aria-label="Next year"
        >
          ›
        </button>
      </div>

      <!-- 3x4 Month Grid -->
      <div class="months-grid">
        @for (m of months; track m.month) {
          <button
            type="button"
            class="month-btn"
            [class.active]="isCurrentSelection(m.month)"
            (click)="selectMonth(m.month); $event.stopPropagation()"
          >
            {{ m.shortName }}
          </button>
        }
      </div>

      <!-- Quick Action: Jump to this month -->
      <div class="popover-footer">
        <button
          type="button"
          class="this-month-btn"
          (click)="goToCurrentMonth(); $event.stopPropagation()"
        >
          This month
        </button>
      </div>
    </div>
  }
</div>
